flutter_launcher_icons:
  # Android adaptive icon: simplified square brand mark for small-size legibility
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon_mark.png"
  remove_alpha_ios: true

  # Android adaptive icon layers
  adaptive_icon_background: "#F6FAFF"
  adaptive_icon_foreground: "assets/icons/app_icon_mark.png"

  # Minimum SDK for adaptive icons (API 26+)
  min_sdk_android: 21

  # Web PWA icon - disabled (mobile-only app, no web target)
  # web:
  #   generate: true
